plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.halcyon2026928.floatdeco'
    compileSdk 34

    defaultConfig {
        applicationId "io.github.halcyon2026928.floatdeco"
        minSdk 26
        targetSdk 32
        versionCode 103
        versionName "1.0.3"
    }

    // 一套代码出两个 APK：中文版 / 英文版。
    // main/res/values/strings.xml 是中文（默认），src/en 覆盖成英文。
    // 用 flavor 而不是 values-en，这样英文包不看系统语言，永远是英文。
    flavorDimensions += "lang"
    productFlavors {
        zh {
            dimension "lang"
        }
        en {
            dimension "lang"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    androidComponents {
        onVariants(selector().all()) { variant ->
            variant.outputs.forEach { output ->
                output.outputFileName.set("freeformos-${variant.flavorName}-${variant.buildType}.apk")
            }
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    compileOnly 'io.github.libxposed:api:102.0.0'
}
