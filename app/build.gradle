plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.halcyon2026928.floatdeco'
    compileSdk 34

    defaultConfig {
        applicationId "io.github.halcyon2026928.floatdeco"
        minSdk 26
        targetSdk 32
        versionCode 101
        versionName "1.0.1"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    androidComponents {
        onVariants(selector().all()) { variant ->
            variant.outputs.forEach { output ->
                output.outputFileName.set("freeformos-${variant.buildType}.apk")
            }
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    compileOnly 'io.github.libxposed:api:102.0.0'
}
